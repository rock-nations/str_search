name: Frontend checks and Playwright

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check out the provided backend
        uses: actions/checkout@v4
        with:
          repository: fahimstrsearch/strs_fe_assessment_v1
          path: strs_fe_assessment_v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Playwright (starts the backend with Docker Compose)
        run: npm run e2e
        env:
          CI: "true"
          BACKEND_DIR: ${{ github.workspace }}/strs_fe_assessment_v1/backend

      - name: Upload report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
